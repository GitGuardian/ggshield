[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitguardian"
version = "0.1.0"
description = "GitGuardian secrets SDK — read secrets from your secret manager straight into memory"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/GitGuardian/ggshield"

# Vendor the single-source providers/*.yaml into the package at build time
# (see hatch_build.py). The copies are generated, so they are gitignored and
# re-included via `artifacts`.
[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/gitguardian"]
artifacts = ["src/gitguardian/providers/*.yaml"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/gitguardian/providers/*.yaml"]

[dependency-groups]
# Installed by default on `uv sync`, so a fresh clone has the full toolchain
# (tests, formatter, linter, type checker) ready with no extra steps.
dev = [
    "pytest>=8",
    "ruff>=0.15.20",
    "ty>=0.0.59",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "S",   # bandit
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# S101: assert is how pytest tests assert.
# S106: TokenAuth test fixtures take env-var *names*, not credentials.
"tests/*" = ["S101", "S106"]

[tool.ty.src]
include = ["src"]

[tool.ty.environment]
python-version = "3.10"
