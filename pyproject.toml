[project]
name = "ggshield"
dynamic = ["version", "scripts"]
description = "Detect secrets from all sources using GitGuardian's brains"
keywords = [
    "cli",
    "devsecops",
    "secrets-detection",
    "security-tools",
    "gitguardian",
]
readme = "README.md"
authors = [{ name = "GitGuardian", email = "support@gitguardian.com" }]
maintainers = [{ name = "GitGuardian", email = "support@gitguardian.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.9",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "platformdirs~=4.2",
    # NB: kept at a tight bound on purpose — charset-normalizer 3.2+ changed its
    # encoding detection and mis-decodes some valid UTF-8 content, which would
    # degrade secret scanning (see _decode_bytes in core/scan/scannable.py).
    "charset-normalizer~=3.1.0",
    "click>=8.1.0,<9",
    "configupdater>=3.2,<4",
    # The floor stays below the CVE-2026-69247 fix (50.0.0) because sigstore
    # 4.1.0, the last release supporting Python 3.9, caps cryptography at < 47.
    "cryptography>=43.0.1,<51",
    "marshmallow>=3.18,<5",
    "marshmallow-dataclass>=8.7.0,<9",
    "oauthlib>=3.2.1,<4",
    "packaging>=22.0",
    "pygitguardian~=1.34.0",
    "pyjwt>=2.13.0,<3",
    "python-dotenv>=0.21.0,<2",
    "pyyaml>=6.0.1,<7",
    "requests>=2.32.0,<3",
    "rich~=13.0",
    "sigstore>=4.0.0,<5",
    "typing-extensions~=4.14",
    "urllib3>=2.2.2,<3",
    "truststore>=0.10.1; python_version >= \"3.10\"",
    "notify-py>=0.3.43",
    # 25.0 is where `keyring.backends.macOS.api.create_cf` replaced
    # `create_cfstr`; `_macos_store_token` needs it to set the Keychain ACL that
    # lets the native hook read the token without a prompt. On 24.x the
    # AttributeError was swallowed and the ACL silently never applied.
    "keyring>=25.0.0,<26",
    "tomli>=2.4.0; python_version < \"3.11\"",
    "tomlkit>=0.13.3,<0.14",
    "filelock>=3.19.1",
    "unearth>=0.18.2",
]

[project.urls]
Homepage = "https://github.com/GitGuardian/ggshield"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "ggshield/__init__.py"

# `ggshield` is the Rust dispatcher and the Python entry point is `ggshield-py`
# when GGSHIELD_BUILD_RUST=1 (the wheel CI matrix); otherwise `ggshield` is the
# Python entry point. See hatch_meta.py / hatch_build.py.
[tool.hatch.metadata.hooks.custom]
path = "hatch_meta.py"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# The Rust sources are needed only to build the platform wheels (from the repo,
# in CI); keep them out of the sdist so an sdist install stays pure Python.
[tool.hatch.build.targets.sdist]
exclude = ["rust"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# Exclude packages released in the last 3 days to avoid pulling a freshly
# published (and possibly malicious) version before it's had time to be vetted.
exclude-newer = "3 days"
exclude-newer-package = { "pygitguardian" = false }
override-dependencies = [
    # vcrpy requires urllib3 < 2 if Python is < 3.10, but it works for us with
    # Python 3.9, so force urllib3 version.
    "urllib3>=2.2.2,<3",
    # pyinstaller declares an upper bound on the Python version it supports
    # (< 3.16 as of 6.21.0), which conflicts with our open-ended
    # `requires-python = ">=3.9"`. Force the version to sidestep the conflict.
    "pyinstaller==6.21.0",
]

# Pin the default index to public PyPI so user-level uv config (e.g. an internal
# GitLab mirror) does not leak into the resolved lock file.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.black]
target-version = ['py36']
line-length = 88
exclude = '/(\.eggs|\.git|\.hg|\.mypy_cache|\.nox|\.tox|\.venv|\.svn|_build|buck-out|build|dist|venv|snapshots|_snap)/'

[tool.pytest.ini_options]
addopts = "--pdbcls=IPython.terminal.debugger:Pdb --durations=10 --durations-min=3.0 --tb=short"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["tests/"]
markers = [
    "uses_gitguardian_api: marks tests that make requests to the GitGuardian API (deselect with '-m \"not uses_gitguardian_api\"')",
]

[tool.isort]
profile = "black"
lines_after_imports = 2

[tool.coverage.report]
exclude_lines = [
    "@abstractmethod",
    "if TYPE_CHECKING:",
    "pragma: no cover",
    "raise NotImplementedError",
    "assert False",
]
omit = ["tests/*"]
fail_under = 80
show_missing = true

[tool.coverage.run]
source = ["."]
omit = [".venv/*"]

[tool.pyright]
include = ["ggshield"]
reportIncompatibleMethodOverride = true
reportMissingParameterType = true
reportUnknownParameterType = true
reportUnnecessaryTypeIgnoreComment = true

[tool.scriv]
version = "literal: ggshield/__init__.py: __version__"
format = "md"
md_header_level = "2"
insert_marker = "# Changelog"

[tool.ty.src]
include = ["ggshield/", "scripts/"]

[dependency-groups]
tests = [
    "pytest-mock",
    "pytest-socket",
    "pytest-xdist",
    "pytest-voluptuous",
    "seed-isort-config",
    "syrupy",
    "jsonschema",
    "vcrpy>=5.1.0",
    "voluptuous<0.15.0",
    "pyfakefs>=5.7.0",
    "factory-boy>=3.3.1",
]
dev = [
    "scriv[toml]",
    "black==24.3.0",
    "coverage",
    "flake8",
    "flake8-isort",
    "flake8-quotes",
    "import-linter",
    "pre-commit",
    "pyright==1.1.367",
    "build>=1.2.2.post1",
    "check-wheel-contents",
    "ipython>=8.12.3",
    "ipdb>=0.13.13",
    "ty>=0.0.32",
    # ty resolves imports against the dev environment, but targets the minimum
    # version of `requires-python`. The `tomli` fallback of `tomllib` is therefore
    # analyzed whatever the interpreter, so devs should install it unconditionally
    "tomli>=2.4.0",
]
standalone = ["pyinstaller==6.21.0"]
