name: Application Release

on:
  push:
    tags:
      - 'v*'

env:
  UV_VERSION: 0.10.8

jobs:
  build_release_assets:
    uses: ./.github/workflows/build_release_assets.yml
    secrets:
      GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
      GITGUARDIAN_API_URL: ${{ secrets.GITGUARDIAN_API_URL }}
      TEST_KNOWN_SECRET: ${{ secrets.TEST_KNOWN_SECRET }}
      TEST_UNKNOWN_SECRET: ${{ secrets.TEST_UNKNOWN_SECRET }}
      TEST_GG_VALID_TOKEN: ${{ secrets.TEST_GG_VALID_TOKEN }}
      TEST_GG_VALID_TOKEN_IGNORE_SHA: ${{ secrets.TEST_GG_VALID_TOKEN_IGNORE_SHA }}
    with:
      release_mode: true
      skip_macos_windows: true

  build_signed_os_packages:
    name: Build packages
    runs-on: ${{ matrix.os }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15-intel, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 10
      - uses: ./.github/actions/build-os-packages
        with:
          artifact-name: os-packages-${{ matrix.os }}
          release-mode: true
          sign: true
          macos-p12-file: ${{ secrets.MACOS_P12_FILE }}
          macos-p12-password: ${{ secrets.MACOS_P12_PASSWORD }}
          macos-api-key-file: ${{ secrets.MACOS_API_KEY_FILE }}
          windows-cert-fingerprint: ${{ secrets.WINDOWS_CERT_FINGERPRINT }}
          sm-api-key: ${{ secrets.SM_API_KEY }}
          sm-host: ${{ secrets.SM_HOST }}
          sm-client-cert-file: ${{ secrets.SM_CLIENT_CERT_FILE }}
          sm-client-cert-password: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          gitguardian-api-key: ${{ secrets.GITGUARDIAN_API_KEY }}
          gitguardian-api-url: ${{ secrets.GITGUARDIAN_API_URL }}
          test-known-secret: ${{ secrets.TEST_KNOWN_SECRET }}
          test-unknown-secret: ${{ secrets.TEST_UNKNOWN_SECRET }}
          test-gg-valid-token: ${{ secrets.TEST_GG_VALID_TOKEN }}
          test-gg-valid-token-ignore-sha: ${{ secrets.TEST_GG_VALID_TOKEN_IGNORE_SHA }}

  scan_vulnerabilities:
    needs: [build_release_assets, build_signed_os_packages]
    uses: ./.github/workflows/scan_packages.yml

  # The platform wheels carrying the Rust `ggshield`. Called from here rather
  # than triggered on the tag itself, so its artifacts land in this run and
  # `push_to_pypi` below can download them.
  build_platform_wheels:
    uses: ./.github/workflows/wheels.yml
    with:
      skip_macos_windows: true

  build_signed_wheels:
    name: wheel ${{ matrix.wheel }}
    runs-on: ${{ matrix.runs-on }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runs-on: macos-14, wheel: macos-universal2 }
          - { runs-on: windows-latest, wheel: windows-amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-wheel
        with:
          sign: true
          macos-p12-file: ${{ secrets.MACOS_P12_FILE }}
          macos-p12-password: ${{ secrets.MACOS_P12_PASSWORD }}
          windows-cert-fingerprint: ${{ secrets.WINDOWS_CERT_FINGERPRINT }}
          sm-api-key: ${{ secrets.SM_API_KEY }}
          sm-host: ${{ secrets.SM_HOST }}
          sm-client-cert-file: ${{ secrets.SM_CLIENT_CERT_FILE }}
          sm-client-cert-password: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}

  push_to_pypi:
    needs: [scan_vulnerabilities, build_platform_wheels, build_signed_wheels]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    # Gated: publishing waits for a second person to approve the deployment.
    environment: release
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      # Two artifacts, never one: both jobs would name a pure wheel
      # `ggshield-<version>-py3-none-any.whl`, so only `build_wheel_sdist`
      # builds one. See .github/workflows/wheels.yml.
      - name: Download the sdist and the pure-Python wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Download the platform wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # A release now uploads eight files from two jobs instead of two from
          # one. PyPI takes them one at a time and refuses a filename it already
          # has, so a failure partway through leaves the rest unpublished and a
          # plain re-run dies on what already landed — with no way to replace it,
          # because a PyPI filename cannot be reused. Skipping what is already
          # there makes the re-run finish the job instead.
          skip-existing: true

  release:
    runs-on: ubuntu-22.04
    needs: scan_vulnerabilities
    continue-on-error: true
    outputs:
      tag: ${{ steps.tags.outputs.tag }}
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')

    # `contents: write` is required for `gh release create` to work.
    # `id-token: write` and `attestations: write` are required by
    # actions/attest-build-provenance to generate signed SLSA provenance.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read info
        id: tags
        shell: bash
        run: |
          echo "tag=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

      - name: Download OS packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: os-packages-*
          path: dist
          merge-multiple: true

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/ggshield-*.pkg
            dist/ggshield_*.deb
            dist/ggshield-*.rpm
            dist/ggshield-*.zip
            dist/ggshield.*.nupkg
            dist/ggshield-*.gz
            dist/ggshield-*.msi

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE_FLAG: ${{ contains(github.ref_name, 'rc') && '--prerelease' || '' }}
        run: |
          gh release create --draft $PRERELEASE_FLAG ${{ steps.tags.outputs.tag }}

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload \
            ${{ steps.tags.outputs.tag }} \
            dist/ggshield-*.pkg \
            dist/ggshield_*.deb \
            dist/ggshield-*.rpm \
            dist/ggshield-*.zip \
            dist/ggshield.*.nupkg \
            dist/ggshield-*.gz \
            dist/ggshield-*.msi

  update_downstream:
    needs: release
    # Dependent repositories move to final releases only.
    if: ${{ !contains(github.ref_name, 'rc') }}
    uses: ./.github/workflows/update-downstream.yml
    secrets:
      PAT_GITHUB: ${{ secrets.PAT_GITHUB }}
    with:
      version: ${{ needs.release.outputs.tag }}

  push_docker_images:
    name: Push Docker image to Docker Hub and GitHub Packages
    needs: scan_vulnerabilities
    runs-on: ubuntu-22.04
    environment: release
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            gitguardian/ggshield
            ghcr.io/gitguardian/ggshield/ggshield
          tags: |
            type=ref,event=tag
          flavor: |
            latest=${{ !contains(github.ref_name, 'rc') }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  push_to_cloudsmith:
    needs: scan_vulnerabilities
    runs-on: ubuntu-22.04
    environment: release
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags') && !contains(github.ref_name, 'rc')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: os-packages-*
          path: dist
          merge-multiple: true

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}

      # Pinned, and cooled with an explicit flag since `uv tool install` reads
      # no `[tool.uv]`: this job holds CLOUDSMITH_API_KEY, and the bare `pip
      # install` it replaces resolved 65 packages fresh from PyPI at each release.
      - name: Install Cloudsmith CLI
        run: |
          uv tool install --exclude-newer '3 days' cloudsmith-cli==1.26.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Push to Cloudsmith
        run: |
          scripts/push-to-cloudsmith
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}

  push_to_chocolatey:
    needs: scan_vulnerabilities
    name: Push to Chocolatey
    runs-on: windows-latest
    environment: release
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: os-packages-windows-*
          path: dist
          merge-multiple: true

      - name: Push to Chocolatey
        shell: bash
        run: |
          scripts/chocolatey/push dist/ggshield.*.nupkg
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
