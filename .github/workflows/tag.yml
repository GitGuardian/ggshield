name: Application Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build_release_assets:
    uses: ./.github/workflows/build_release_assets.yml
    secrets: inherit
    with:
      release_mode: true
      sign: true

  # The platform wheels carrying the Rust `ggshield`. Called from here rather
  # than triggered on the tag itself, so its artifacts land in this run and
  # `push_to_pypi` below can download them.
  build_platform_wheels:
    uses: ./.github/workflows/wheels.yml
    secrets: inherit
    with:
      sign: true

  push_to_pypi:
    needs: [build_release_assets, build_platform_wheels]
    runs-on: ubuntu-22.04
    # Gated: publishing waits for a second person to approve the deployment.
    environment: release
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      # Two artifacts, never one: both jobs would name a pure wheel
      # `ggshield-<version>-py3-none-any.whl`, so only `build_wheel_sdist`
      # builds one. See .github/workflows/wheels.yml.
      - name: Download the sdist and the pure-Python wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Download the platform wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          user: __token__
          password: ${{ secrets.pypi_password }}
          # A release now uploads eight files from two jobs instead of two from
          # one. PyPI takes them one at a time and refuses a filename it already
          # has, so a failure partway through leaves the rest unpublished and a
          # plain re-run dies on what already landed — with no way to replace it,
          # because a PyPI filename cannot be reused. Skipping what is already
          # there makes the re-run finish the job instead.
          skip-existing: true

  release:
    runs-on: ubuntu-22.04
    needs: build_release_assets
    continue-on-error: true
    outputs:
      tag: ${{ steps.tags.outputs.tag }}
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')

    # `contents: write` is required for `gh release create` to work.
    # `id-token: write` and `attestations: write` are required by
    # actions/attest-build-provenance to generate signed SLSA provenance.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read info
        id: tags
        shell: bash
        run: |
          echo "tag=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

      - name: Download OS packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: os-packages-*
          path: dist
          merge-multiple: true

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/ggshield-*.pkg
            dist/ggshield_*.deb
            dist/ggshield-*.rpm
            dist/ggshield-*.zip
            dist/ggshield.*.nupkg
            dist/ggshield-*.gz
            dist/ggshield-*.msi

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create --draft ${{ steps.tags.outputs.tag }}

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload \
            ${{ steps.tags.outputs.tag }} \
            dist/ggshield-*.pkg \
            dist/ggshield_*.deb \
            dist/ggshield-*.rpm \
            dist/ggshield-*.zip \
            dist/ggshield.*.nupkg \
            dist/ggshield-*.gz \
            dist/ggshield-*.msi

  update_downstream:
    needs: release
    uses: ./.github/workflows/update-downstream.yml
    secrets: inherit
    with:
      version: ${{ needs.release.outputs.tag }}

  push_docker_images:
    name: Push Docker image to Docker Hub and GitHub Packages
    runs-on: ubuntu-22.04
    environment: release
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            gitguardian/ggshield
            ghcr.io/gitguardian/ggshield/ggshield
          tags: |
            type=ref,event=tag

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            gitguardian/ggshield:latest
            ghcr.io/gitguardian/ggshield/ggshield:latest

  push_to_cloudsmith:
    needs: build_release_assets
    runs-on: ubuntu-22.04
    environment: release
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: os-packages-*
          path: dist
          merge-multiple: true

      - name: Install Cloudsmith CLI
        run: pip install cloudsmith-cli

      - name: Push to Cloudsmith
        run: |
          scripts/push-to-cloudsmith
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}

  push_to_chocolatey:
    needs: build_release_assets
    name: Push to Chocolatey
    runs-on: windows-latest
    environment: release
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: os-packages-windows-*
          path: dist
          merge-multiple: true

      - name: Push to Chocolatey
        shell: bash
        run: |
          scripts/chocolatey/push dist/ggshield.*.nupkg
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
