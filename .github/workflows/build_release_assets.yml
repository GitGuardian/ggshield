name: Build release assets

# This workflow is used by the ci and tag workflows to build all release
# assets. It can also be triggered manually.

on:
  workflow_call:
    inputs:
      release_mode:
        description: 'Release mode (no commit sha in version number)'
        type: boolean
        default: false
      sign:
        description: 'Code-sign the binaries (needs secrets, so no PR from a fork can)'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Release mode (no commit sha in version number)'
        type: boolean
        default: false
      sign:
        description: 'Code-sign the binaries (needs secrets, so no PR from a fork can)'
        type: boolean
        default: false

env:
  UV_VERSION: 0.10.8
  DEFAULT_PYTHON_VERSION: '3.14'
  GRYPE_VERSION: 0.116.1

jobs:
  build_wheel_sdist:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}

      # No GGSHIELD_BUILD_RUST: this is the sdist plus the pure-Python
      # `py3-none-any` fallback wheel, where `ggshield` is the Python entry
      # point. The platform wheels come from .github/workflows/wheels.yml.
      - name: Create packages
        run: |
          uv build

      - name: Smoke test the pure wheel
        run: |
          uv venv /tmp/smoke
          VIRTUAL_ENV=/tmp/smoke uv pip install dist/*-py3-none-any.whl
          /tmp/smoke/bin/ggshield --version

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist

  build_os_packages:
    name: Build packages
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            # When building on Linux we use a container to build using an old enough version
            container: rockylinux/rockylinux:8
            arch: x86_64
            nfpm_arch: x86_64
            sha256sum:
              python: d6254462d5fe066810a472d286861f6a18f66400008bfa9688e202a5672e88cb
              nfpm: 9f8effa24bc6033b509611dbe68839542a63e825525b195672298c369051ef0b
          - os: ubuntu-24.04-arm
            container: rockylinux/rockylinux:8
            arch: aarch64
            nfpm_arch: arm64
            sha256sum:
              python: 44f86d58f3bbc1aa6c95ee90f03226e0fdbd22475a98c4410e5a20042b7f40d3
              nfpm: ccfc3a154dec318100c6b6e28deddef0a1ffddf5e258364d74b647a129c72a0e
          - os: windows-2022
          - os: macos-15-intel
            arch: x86_64
            sha256sum:
              python: 26e384a6000a2c6e7484bca9c6441553c0c9f701c87dcd2e632d994edd000e9c
              rcodesign: bca6e648afaddd48f1c3d5dd25aa516659992cbbd2ba7131ba6add739aa895d3
          - os: macos-14
            arch: aarch64
            sha256sum:
              python: 1c7e8db27d1f5c029c232406103b7216baaa8a32a900a64f6dee20f8eaaca1af
              rcodesign: 163520079cd6ad1427791c792735a6ddfcb8eca0187bbcf0cc0bebfa4a62153d
    steps:
      - uses: actions/checkout@v7
        with:
          # Get enough commits to run `ggshield secret scan commit-range` on ourselves
          fetch-depth: 10

      - name: Set up Python 3.14 (Windows 1/2)
        if: matrix.os == 'windows-2022'
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Set up Python 3.14 (Windows 2/2)
        if: matrix.os == 'windows-2022'
        shell: bash
        run: |
          echo PYTHON_CMD=python >> $GITHUB_ENV

      - name: Install Linux specific dependencies
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          # Install latest security updates
          yum update -y

          # Install necessary packages
          yum install -y \
            git-core \
            findutils

          # Install Python 3.14 (we can't use the one from setup-python@v5: it requires a more recent version of libc)
          PYTHON_VERSION=3.14.6
          PYTHON_BUILD=20260728
          scripts/download \
            https://github.com/indygreg/python-build-standalone/releases/download/${PYTHON_BUILD}/cpython-${PYTHON_VERSION}+${PYTHON_BUILD}-${{ matrix.arch }}-unknown-linux-gnu-install_only_stripped.tar.gz \
            python.tar.gz \
            ${{ matrix.sha256sum.python }}

          tar xf python.tar.gz

          # Make Python available
          echo PATH=$PWD/python/bin:$PATH >> $GITHUB_ENV
          echo PYTHON_CMD=$PWD/python/bin/python >> $GITHUB_ENV

          # Install NFPM
          NFPM_VERSION=2.36.1

          scripts/download \
            https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${{ matrix.nfpm_arch }}.tar.gz \
            nfpm.tar.gz \
            ${{ matrix.sha256sum.nfpm }}

          tar xf nfpm.tar.gz nfpm
          cp nfpm /usr/local/bin

      - name: Install macOS specific dependencies
        if: startsWith(matrix.os, 'macos-')
        run: |
          # scripts/download needs the `sha256sum` command
          brew install coreutils

          # Install Python. We don't use actions/setup-python because on M1
          # macs it installs the Framework version of Python, and the binaries
          # produced with that version do not pass Apple notarization step.
          # (tested with actions/setup-python@v4 and @v5)
          PYTHON_VERSION=3.14.6
          PYTHON_BUILD=20260728

          scripts/download \
            https://github.com/indygreg/python-build-standalone/releases/download/${PYTHON_BUILD}/cpython-${PYTHON_VERSION}+${PYTHON_BUILD}-${{ matrix.arch }}-apple-darwin-install_only.tar.gz \
            python.tar.gz \
            ${{ matrix.sha256sum.python }}

          tar xf python.tar.gz

          # Make Python available
          echo PATH=$PWD/python/bin:$PATH >> $GITHUB_ENV
          echo PYTHON_CMD=$PWD/python/bin/python >> $GITHUB_ENV

          # Install rcodesign
          RCODESIGN_VERSION=0.27.0

          scripts/download \
            https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VERSION}/apple-codesign-${RCODESIGN_VERSION}-${{ matrix.arch }}-apple-darwin.tar.gz \
            rcodesign.tar.gz \
            ${{ matrix.sha256sum.rcodesign }}

          tar --strip-components=1 -xzf rcodesign.tar.gz

          # Make it available
          cp rcodesign /usr/local/bin

      - name: Install WiX Toolset
        if: matrix.os == 'windows-2022'
        shell: bash
        run: dotnet tool install --global wix --version 5.0.2

      - name: Install dependencies
        shell: bash
        run: |
          $PYTHON_CMD -m pip install --upgrade pip
          # Install uv
          $PYTHON_CMD -m pip install uv==$UV_VERSION
          uv sync --locked --no-default-groups --group tests --group standalone

      - name: Prepare macOS secrets
        if: startsWith(matrix.os, 'macos-') && inputs.sign
        run: |
          set -euo pipefail
          SECRETS_DIR=$TMPDIR/secrets
          mkdir "$SECRETS_DIR"
          # Prepare our secret files
          # The p12-file is base64-encoded because it's binary
          echo "$MACOS_P12_FILE" | base64 --decode > "$SECRETS_DIR/cert.p12"
          echo "$MACOS_P12_PASSWORD" > "$SECRETS_DIR/cert.pwd"
          echo "$MACOS_API_KEY_FILE" > "$SECRETS_DIR/rcodesign-notarize-key.json"

          # Tell next steps where to find them
          cat >> $GITHUB_ENV <<EOF
          MACOS_P12_FILE=$SECRETS_DIR/cert.p12
          MACOS_P12_PASSWORD_FILE=$SECRETS_DIR/cert.pwd
          MACOS_API_KEY_FILE=$SECRETS_DIR/rcodesign-notarize-key.json
          EOF
        env:
          MACOS_P12_FILE: ${{ secrets.MACOS_P12_FILE }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
          MACOS_API_KEY_FILE: ${{ secrets.MACOS_API_KEY_FILE }}

      - name: Setup Windows environment
        if: startsWith(matrix.os, 'windows-') && inputs.sign
        shell: bash
        run: |
          signtool_install_dir="/c/Program Files (x86)/Windows Kits/10/bin/10.0.22621.0/x64"
          smctl_install_dir="/c/Program Files/DigiCert/DigiCert Keylocker Tools"

          # Add signtool dir to $PATH
          if [ ! -x "$signtool_install_dir/signtool.exe" ] ; then
            echo "signtool.exe is not in '$signtool_install_dir'"
            exit 1
          fi
          echo "$signtool_install_dir" >> $GITHUB_PATH

          # Add smctl dir to $PATH
          # Don't test if smctl is there: it is installed by the next step
          echo "$smctl_install_dir" >> $GITHUB_PATH

          # Create our certificate file
          cert_file="$TMPDIR/cert.p12"
          echo "${{ secrets.SM_CLIENT_CERT_FILE }}" | base64 --decode > "$cert_file"

          # Add secrets to env
          cat >> $GITHUB_ENV <<EOF
          WINDOWS_CERT_FINGERPRINT=${{ secrets.WINDOWS_CERT_FINGERPRINT }}
          SM_API_KEY=${{ secrets.SM_API_KEY }}
          SM_HOST=${{ secrets.SM_HOST }}
          SM_CLIENT_CERT_FILE=$cert_file
          SM_CLIENT_CERT_PASSWORD=${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          EOF

      - name: Install Windows dependencies
        if: startsWith(matrix.os, 'windows-') && inputs.sign
        shell: bash
        run: |
          scripts/build-os-packages/install-keylockertools

      - name: Build
        shell: bash
        run: |
          args=""
          if [ "${{ inputs.sign }}" = "true" ] ; then
            args="$args --sign"
          fi
          # The +sha stamp is what tells an internal build apart from the release.
          if [ "${{ inputs.release_mode }}" != "true" ] ; then
            args="$args --suffix +${GITHUB_SHA:0:7}"
          fi
          # Run the script with `bash -c` because `uv run` does not
          # automatically do it on Windows
          uv run --no-sync bash -c "scripts/build-os-packages/build-os-packages $args"

      - name: Override base Docker image used for functional tests on Windows
        if: matrix.os == 'windows-2022'
        # This is required because GitHub Windows runner is not configured to
        # run Linux-based Docker images
        shell: bash
        run: |
          echo "GGTEST_DOCKER_IMAGE=mcr.microsoft.com/windows/nanoserver:ltsc2022" >> $GITHUB_ENV

      - name: Functional tests
        shell: bash
        # See note about steps requiring the GITGUARDIAN_API at the top of this file
        if: ${{ !github.event.pull_request.head.repo.fork }}
        run: |
          uv run --no-sync bash -c "scripts/build-os-packages/build-os-packages functests"
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
          GITGUARDIAN_API_URL: ${{ secrets.GITGUARDIAN_API_URL }}
          TEST_KNOWN_SECRET: ${{ secrets.TEST_KNOWN_SECRET }}
          TEST_GG_VALID_TOKEN: ${{ secrets.TEST_GG_VALID_TOKEN }}
          TEST_GG_VALID_TOKEN_IGNORE_SHA: ${{ secrets.TEST_GG_VALID_TOKEN_IGNORE_SHA }}
          TEST_UNKNOWN_SECRET: ${{ secrets.TEST_UNKNOWN_SECRET }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: os-packages-${{ matrix.os }}
          path: |
            dist/ggshield-*.gz
            dist/ggshield-*.pkg
            dist/ggshield-*.zip
            dist/ggshield-*.rpm
            dist/ggshield_*.deb
            dist/ggshield.*.nupkg
            dist/ggshield-*.msi

  # Run some basic tests, the goal is to verify the ggshield binary has all the
  # libraries it needs to run
  linux_package_smoke_tests:
    needs: build_os_packages
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        # Each runner architecture tests the packages built by the matching
        # build_os_packages matrix entry
        runner:
          - ubuntu-22.04
          - ubuntu-24.04-arm
        image:
          - debian:stable
          - ubuntu:latest
          - rockylinux/rockylinux:8.8
          - rockylinux/rockylinux:9
          - opensuse/leap
    steps:
      - name: Install requirements
        run: |
          case "${{ matrix.image }}" in
            debian:*|ubuntu:*)
              apt update
              apt install --no-install-recommends -y git
              ;;
            rockylinux*)
              yum install -y git-core
              ;;
            opensuse*)
              zypper install -y git-core
              ;;
          esac

      - name: Download OS packages
        uses: actions/download-artifact@v8
        with:
          pattern: os-packages-${{ matrix.runner }}
          path: dist
          merge-multiple: true

      - name: Setup
        # Install ggshield dependencies and the package itself
        run: |
          case "${{ matrix.image }}" in
            debian:*|ubuntu:*)
              dpkg -i dist/*.deb
              ;;
            rockylinux*)
              rpm -i dist/*.rpm
              ;;
            opensuse*)
              rpm -i dist/*.rpm
              ;;
            clearlinux*)

              # Unpack ggshield in /usr/local/ggshield
              pkg_dir=$PWD/dist
              mkdir /usr/local/ggshield
              cd /usr/local/ggshield
              tar --strip-components 1 -xf $pkg_dir/*.tar.gz

              # Add ggshield to $PATH
              mkdir /usr/local/bin
              ln -s $PWD/ggshield /usr/local/bin/ggshield
              ;;
          esac

      - name: Smoke test
        run: |
          ggshield --version
          ggshield --help

  scan_vulnerabilities:
    name: Scan built packages for vulnerabilities
    needs: build_os_packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/vulnscan
            .grype.yaml

      - name: Download built packages
        uses: actions/download-artifact@v8
        with:
          pattern: os-packages-*
          path: packages

      - name: Compute cache date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Grype vulnerability database
        uses: actions/cache@v6
        with:
          path: ~/.cache/grype/db
          # The DB is refreshed daily upstream; keying on the date avoids
          # re-downloading it on every run.
          key: grype-db-${{ steps.date.outputs.date }}

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin "v${GRYPE_VERSION}"

      - name: Scan and report
        # tee, not >>: the report is genuinely useful in the plain job log
        # too (searchable, visible without switching to the Summary tab).
        run: scripts/vulnscan/scan_packages.py packages | tee -a "$GITHUB_STEP_SUMMARY"
