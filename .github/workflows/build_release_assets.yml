name: Build release assets

# This workflow is used by the ci and tag workflows to build all release
# assets. It can also be triggered manually.

on:
  workflow_call:
    inputs:
      release_mode:
        description: 'Release mode (no commit sha in version number)'
        type: boolean
        default: false
      sign:
        description: 'Code-sign the binaries (needs secrets, so no PR from a fork can)'
        type: boolean
        default: false
    secrets:
      GITGUARDIAN_API_KEY:
        required: false
      GITGUARDIAN_API_URL:
        required: false
      TEST_KNOWN_SECRET:
        required: false
      TEST_UNKNOWN_SECRET:
        required: false
      TEST_GG_VALID_TOKEN:
        required: false
      TEST_GG_VALID_TOKEN_IGNORE_SHA:
        required: false
      MACOS_P12_FILE:
        required: false
      MACOS_P12_PASSWORD:
        required: false
      MACOS_API_KEY_FILE:
        required: false
      WINDOWS_CERT_FINGERPRINT:
        required: false
      SM_API_KEY:
        required: false
      SM_HOST:
        required: false
      SM_CLIENT_CERT_FILE:
        required: false
      SM_CLIENT_CERT_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Release mode (no commit sha in version number)'
        type: boolean
        default: false
      sign:
        description: 'Code-sign the binaries (needs secrets, so no PR from a fork can)'
        type: boolean
        default: false

env:
  UV_VERSION: 0.10.8
  DEFAULT_PYTHON_VERSION: '3.14'
  GRYPE_VERSION: 0.116.1
  # grype_${GRYPE_VERSION}_linux_amd64.tar.gz, from the release's
  # grype_${GRYPE_VERSION}_checksums.txt. Update both together.
  GRYPE_SHA256: 0122df7b655981abe547ad3d2190d65551dac6a2bfc80b4dc2a989b5d0587458

jobs:
  build_wheel_sdist:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}

      # No GGSHIELD_BUILD_RUST: this is the sdist plus the pure-Python
      # `py3-none-any` fallback wheel, where `ggshield` is the Python entry
      # point. The platform wheels come from .github/workflows/wheels.yml.
      - name: Create packages
        run: |
          uv build

      - name: Smoke test the pure wheel
        run: |
          uv venv /tmp/smoke
          VIRTUAL_ENV=/tmp/smoke uv pip install dist/*-py3-none-any.whl
          /tmp/smoke/bin/ggshield --version

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist

  build_os_packages:
    name: Build packages
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    environment: ${{ inputs.sign && 'signing' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            # When building on Linux we use a container to build using an old enough version
            # Pinned by digest rather than the floating `8`: this container
            # compiles the released binaries, so a repushed tag would change
            # what we ship. Bumped by Dependabot, behind the 3-day cooldown.
            container: rockylinux/rockylinux:8.10@sha256:e8a49c5403b687db05d4d67333fa45808fbe74f36e683cec7abb1f7d0f2338c6
          - os: ubuntu-24.04-arm
            container: rockylinux/rockylinux:8.10@sha256:e8a49c5403b687db05d4d67333fa45808fbe74f36e683cec7abb1f7d0f2338c6
          - os: windows-2022
          - os: macos-15-intel
          - os: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Get enough commits to run `ggshield secret scan commit-range` on ourselves
          fetch-depth: 10
      - uses: ./.github/actions/build-os-packages
        with:
          artifact-name: os-packages-${{ matrix.os }}
          release-mode: ${{ inputs.release_mode }}
          sign: ${{ inputs.sign }}
          macos-p12-file: ${{ secrets.MACOS_P12_FILE }}
          macos-p12-password: ${{ secrets.MACOS_P12_PASSWORD }}
          macos-api-key-file: ${{ secrets.MACOS_API_KEY_FILE }}
          windows-cert-fingerprint: ${{ secrets.WINDOWS_CERT_FINGERPRINT }}
          sm-api-key: ${{ secrets.SM_API_KEY }}
          sm-host: ${{ secrets.SM_HOST }}
          sm-client-cert-file: ${{ secrets.SM_CLIENT_CERT_FILE }}
          sm-client-cert-password: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          gitguardian-api-key: ${{ secrets.GITGUARDIAN_API_KEY }}
          gitguardian-api-url: ${{ secrets.GITGUARDIAN_API_URL }}
          test-known-secret: ${{ secrets.TEST_KNOWN_SECRET }}
          test-unknown-secret: ${{ secrets.TEST_UNKNOWN_SECRET }}
          test-gg-valid-token: ${{ secrets.TEST_GG_VALID_TOKEN }}
          test-gg-valid-token-ignore-sha: ${{ secrets.TEST_GG_VALID_TOKEN_IGNORE_SHA }}

  # Run some basic tests, the goal is to verify the ggshield binary has all the
  # libraries it needs to run
  linux_package_smoke_tests:
    needs: build_os_packages
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        # Each runner architecture tests the packages built by the matching
        # build_os_packages matrix entry
        runner:
          - ubuntu-22.04
          - ubuntu-24.04-arm
        # Deliberately unpinned, and tracking the major rather than a point
        # release: enterprise distros only patch the newest point release, so
        # `8.8` was a frozen 2023 snapshot that stopped getting updates when
        # 8.9 shipped. These smoke tests check our packages against the distros
        # users actually run and receive patches for, so following the tags is
        # the signal.
        image:
          - debian:stable-20260824
          - ubuntu:26.04
          - rockylinux/rockylinux:8
          - rockylinux/rockylinux:9
          - opensuse/leap:16.0
    steps:
      - name: Install requirements
        run: |
          case "${{ matrix.image }}" in
            debian:*|ubuntu:*)
              apt update
              apt install --no-install-recommends -y git
              ;;
            rockylinux*)
              yum install -y git-core
              ;;
            opensuse*)
              zypper install -y git-core
              ;;
          esac

      - name: Download OS packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: os-packages-${{ matrix.runner }}
          path: dist
          merge-multiple: true

      - name: Setup
        # Install ggshield dependencies and the package itself
        run: |
          case "${{ matrix.image }}" in
            debian:*|ubuntu:*)
              dpkg -i dist/*.deb
              ;;
            rockylinux*)
              rpm -i dist/*.rpm
              ;;
            opensuse*)
              rpm -i dist/*.rpm
              ;;
            clearlinux*)

              # Unpack ggshield in /usr/local/ggshield
              pkg_dir=$PWD/dist
              mkdir /usr/local/ggshield
              cd /usr/local/ggshield
              tar --strip-components 1 -xf $pkg_dir/*.tar.gz

              # Add ggshield to $PATH
              mkdir /usr/local/bin
              ln -s $PWD/ggshield /usr/local/bin/ggshield
              ;;
          esac

      - name: Smoke test
        run: |
          ggshield --version
          ggshield --help

  scan_vulnerabilities:
    name: Scan built packages for vulnerabilities
    needs: build_os_packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/vulnscan
            scripts/download
            .grype.yaml

      - name: Download built packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: os-packages-*
          path: packages

      - name: Compute cache date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Grype vulnerability database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/grype/db
          # The DB is refreshed daily upstream; keying on the date avoids
          # re-downloading it on every run.
          key: grype-db-${{ steps.date.outputs.date }}

      - name: Install Grype
        # Not `curl .../main/install.sh | sh`: that fetches an unpinned script
        # from a branch and pipes it into a shell, so upstream can change what
        # runs here at any time. The release tarball is pinned and
        # checksum-verified instead, like rustup-init in wheels.yml.
        run: |
          scripts/download \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz" \
            /tmp/grype.tar.gz \
            "${GRYPE_SHA256}"
          tar -xzf /tmp/grype.tar.gz -C /tmp grype
          install -m 0755 /tmp/grype /usr/local/bin/grype

      - name: Scan and report
        # tee, not >>: the report is genuinely useful in the plain job log
        # too (searchable, visible without switching to the Summary tab).
        run: scripts/vulnscan/scan_packages.py packages | tee -a "$GITHUB_STEP_SUMMARY"
