name: Build release assets

# This workflow is used by the ci and tag workflows to build all release
# assets. It can also be triggered manually.

on:
  workflow_call:
    inputs:
      release_mode:
        description: 'Release mode (no commit sha in version number)'
        type: boolean
        default: false
      skip_macos_windows:
        description: 'Leave the macOS and Windows packages to the caller, which builds them signed'
        type: boolean
        default: false
    secrets:
      GITGUARDIAN_API_KEY:
        required: false
      GITGUARDIAN_API_URL:
        required: false
      TEST_KNOWN_SECRET:
        required: false
      TEST_UNKNOWN_SECRET:
        required: false
      TEST_GG_VALID_TOKEN:
        required: false
      TEST_GG_VALID_TOKEN_IGNORE_SHA:
        required: false
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Release mode (no commit sha in version number)'
        type: boolean
        default: false

env:
  UV_VERSION: 0.10.8
  DEFAULT_PYTHON_VERSION: '3.14'

jobs:
  build_wheel_sdist:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}

      # No GGSHIELD_BUILD_RUST: this is the sdist plus the pure-Python
      # `py3-none-any` fallback wheel, where `ggshield` is the Python entry
      # point. The platform wheels come from .github/workflows/wheels.yml.
      - name: Create packages
        run: |
          uv build

      - name: Smoke test the pure wheel
        run: |
          uv venv /tmp/smoke
          VIRTUAL_ENV=/tmp/smoke uv pip install dist/*-py3-none-any.whl
          /tmp/smoke/bin/ggshield --version

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist

  build_os_packages:
    name: Build packages
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            # When building on Linux we use a container to build using an old enough version
            # Pinned by digest rather than the floating `8`: this container
            # compiles the released binaries, so a repushed tag would change
            # what we ship. Bumped by Dependabot, behind the 3-day cooldown.
            container: rockylinux/rockylinux:8.10@sha256:e8a49c5403b687db05d4d67333fa45808fbe74f36e683cec7abb1f7d0f2338c6
          - os: ubuntu-24.04-arm
            container: rockylinux/rockylinux:8.10@sha256:e8a49c5403b687db05d4d67333fa45808fbe74f36e683cec7abb1f7d0f2338c6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Get enough commits to run `ggshield secret scan commit-range` on ourselves
          fetch-depth: 10
      - uses: ./.github/actions/build-os-packages
        with:
          artifact-name: os-packages-${{ matrix.os }}
          release-mode: ${{ inputs.release_mode }}
          gitguardian-api-key: ${{ secrets.GITGUARDIAN_API_KEY }}
          gitguardian-api-url: ${{ secrets.GITGUARDIAN_API_URL }}
          test-known-secret: ${{ secrets.TEST_KNOWN_SECRET }}
          test-unknown-secret: ${{ secrets.TEST_UNKNOWN_SECRET }}
          test-gg-valid-token: ${{ secrets.TEST_GG_VALID_TOKEN }}
          test-gg-valid-token-ignore-sha: ${{ secrets.TEST_GG_VALID_TOKEN_IGNORE_SHA }}

  build_macos_windows_packages:
    name: Build packages
    if: ${{ !inputs.skip_macos_windows }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15-intel, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Get enough commits to run `ggshield secret scan commit-range` on ourselves
          fetch-depth: 10
      - uses: ./.github/actions/build-os-packages
        with:
          artifact-name: os-packages-${{ matrix.os }}
          release-mode: ${{ inputs.release_mode }}
          gitguardian-api-key: ${{ secrets.GITGUARDIAN_API_KEY }}
          gitguardian-api-url: ${{ secrets.GITGUARDIAN_API_URL }}
          test-known-secret: ${{ secrets.TEST_KNOWN_SECRET }}
          test-unknown-secret: ${{ secrets.TEST_UNKNOWN_SECRET }}
          test-gg-valid-token: ${{ secrets.TEST_GG_VALID_TOKEN }}
          test-gg-valid-token-ignore-sha: ${{ secrets.TEST_GG_VALID_TOKEN_IGNORE_SHA }}

  # Run some basic tests, the goal is to verify the ggshield binary has all the
  # libraries it needs to run
  linux_package_smoke_tests:
    needs: build_os_packages
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        # Each runner architecture tests the packages built by the matching
        # build_os_packages matrix entry
        runner:
          - ubuntu-22.04
          - ubuntu-24.04-arm
        # Deliberately unpinned, and tracking the major rather than a point
        # release: enterprise distros only patch the newest point release, so
        # `8.8` was a frozen 2023 snapshot that stopped getting updates when
        # 8.9 shipped. These smoke tests check our packages against the distros
        # users actually run and receive patches for, so following the tags is
        # the signal.
        image:
          - debian:stable-20260824
          - ubuntu:26.04
          - rockylinux/rockylinux:8
          - rockylinux/rockylinux:9
          - opensuse/leap:16.0
    steps:
      - name: Install requirements
        run: |
          case "${{ matrix.image }}" in
            debian:*|ubuntu:*)
              apt update
              apt install --no-install-recommends -y git
              ;;
            rockylinux*)
              yum install -y git-core
              ;;
            opensuse*)
              zypper install -y git-core
              ;;
          esac

      - name: Download OS packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: os-packages-${{ matrix.runner }}
          path: dist
          merge-multiple: true

      - name: Setup
        # Install ggshield dependencies and the package itself
        run: |
          case "${{ matrix.image }}" in
            debian:*|ubuntu:*)
              dpkg -i dist/*.deb
              ;;
            rockylinux*)
              rpm -i dist/*.rpm
              ;;
            opensuse*)
              rpm -i dist/*.rpm
              ;;
            clearlinux*)

              # Unpack ggshield in /usr/local/ggshield
              pkg_dir=$PWD/dist
              mkdir /usr/local/ggshield
              cd /usr/local/ggshield
              tar --strip-components 1 -xf $pkg_dir/*.tar.gz

              # Add ggshield to $PATH
              mkdir /usr/local/bin
              ln -s $PWD/ggshield /usr/local/bin/ggshield
              ;;
          esac

      - name: Smoke test
        run: |
          ggshield --version
          ggshield --help

  scan_vulnerabilities:
    needs: [build_os_packages, build_macos_windows_packages]
    if: ${{ !inputs.skip_macos_windows }}
    uses: ./.github/workflows/scan_packages.yml
