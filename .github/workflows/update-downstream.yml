name: Update Downstream Dependents

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to update to'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version to update to'
        required: true
        type: string
    secrets:
      PAT_GITHUB:
        description: 'Token that can push a branch and open a PR on the downstream repositories'
        required: true

permissions: {}

jobs:
  update-ggshield-version:
    runs-on: ubuntu-latest
    # Gated: opens PRs on other repositories with a PAT, so it waits for the
    # same approval as the other publishing jobs. `environment` must live on the
    # job because this is a reusable workflow, and it also covers the
    # workflow_dispatch entry point.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        repository:
          - GitGuardian/gitguardian-vscode
          - GitGuardian/ggshield-azure-devops-extension
    name: ${{ matrix.repository }}
    steps:
      - name: Compute version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Strip the tag's leading 'v'
          version="${INPUT_VERSION#v}"
          # The version lands in a branch name, a commit and a PR opened with
          # PAT_GITHUB: accept release versions only.
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$ ]]; then
            echo "::error::Not a release version: $INPUT_VERSION"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Checkout ${{ matrix.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          token: ${{ secrets.PAT_GITHUB }}
          sparse-checkout: |
            ggshield_version
          sparse-checkout-cone-mode: false

      - name: Create branch
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git checkout -b "update-ggshield-to-$VERSION"

      - name: Update ggshield_version file
        run: |
          echo "$VERSION" > ggshield_version

      - name: Commit changes
        run: |
          git add ggshield_version
          git commit -m "Update ggshield version to $VERSION"

      - name: Push changes
        run: |
          git push --set-upstream origin "update-ggshield-to-$VERSION" --force

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.PAT_GITHUB }}
          REPOSITORY: ${{ matrix.repository }}
        run: |
          gh pr create \
            --repo "$REPOSITORY" \
            --title "Update ggshield version to $VERSION" \
            --body "This PR updates ggshield to version $VERSION. This update was automatically generated by a workflow on the ggshield repository." \
            --base main \
            --head "update-ggshield-to-$VERSION"
