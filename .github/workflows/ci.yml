name: CI

# About steps requiring the GITGUARDIAN_API_KEY:
#
# For security reasons, secrets are not available when a workflow is triggered by a pull request from a fork. This
# causes all steps requiring the GITGUARDIAN_API_KEY to fail. To avoid this, we skip those steps when we are triggered
# by a pull request from a fork.

on:
  pull_request:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
    paths-ignore:
      - 'doc/**'
      - 'README.md'

env:
  UV_VERSION: 0.10.8
  DEFAULT_PYTHON_VERSION: '3.9'

jobs:
  lint:
    name: Lint package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv sync --locked --group tests --group dev

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit hooks
        run: uv run pre-commit install --install-hooks

      - name: Skip ggshield hooks when running from a fork
        # See note about steps requiring the GITGUARDIAN_API at the top of this file
        if: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          echo "SKIP=ggshield,ggshield-local" >> $GITHUB_ENV

      - name: Run pre-commit checks
        run: |
          uv run pre-commit run --show-diff-on-failure --all-files
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: |
          PR_REF="${GITHUB_REF%/merge}/head"
          git fetch origin "$PR_REF"
          if git log --format=%s "origin/$GITHUB_BASE_REF..FETCH_HEAD" | grep '^fixup!' ; then
              echo 'Error: this pull request contains fixup commits. Squash them.'
              exit 1
          fi
          # In case `git log` fails
          exit "${PIPESTATUS[0]}"

  build:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15-intel, windows-2022]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          # Get enough commits to run `ggshield secret scan commit-range` on ourselves
          fetch-depth: 10

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --locked --group dev --group tests

      - name: Override base Docker image used for functional tests on Windows
        if: matrix.os == 'windows-2022'
        # This is required because GitHub Windows runner is not configured to
        # run Linux-based Docker images
        shell: bash
        run: |
          echo "GGTEST_DOCKER_IMAGE=mcr.microsoft.com/windows/nanoserver:ltsc2022" >> $GITHUB_ENV

      - name: Ensure a clean package installation
        run: |
          uv build --wheel
          # The created wheel (.whl) file will be found and analyzed within the `dist/` folder
          uv run check-wheel-contents dist/

      - name: Run unit tests
        run: |
          uv run coverage run --source ggshield -m pytest --disable-pytest-warnings --disable-socket tests/unit

      - name: Gather coverage report
        run: |
          uv run coverage report --fail-under=80
          uv run coverage xml

      - uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Run functional tests (non-API)
        shell: bash
        run: |
          make functest
        env:
          FUNCTEST_ARGS: '-m "not uses_gitguardian_api"'

  functest_api:
    name: Functional tests (API)
    # See note about steps requiring the GITGUARDIAN_API at the top of this file
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Get enough commits to run `ggshield secret scan commit-range` on ourselves
          fetch-depth: 10

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv sync --locked --group dev --group tests

      - name: Run functional tests (API)
        shell: bash
        run: |
          make functest
        env:
          FUNCTEST_ARGS: '-m "uses_gitguardian_api"'
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
          GITGUARDIAN_API_URL: ${{ secrets.GITGUARDIAN_API_URL }}
          TEST_KNOWN_SECRET: ${{ secrets.TEST_KNOWN_SECRET }}
          TEST_GG_VALID_TOKEN: ${{ secrets.TEST_GG_VALID_TOKEN }}
          TEST_GG_VALID_TOKEN_IGNORE_SHA: ${{ secrets.TEST_GG_VALID_TOKEN_IGNORE_SHA }}
          TEST_UNKNOWN_SECRET: ${{ secrets.TEST_UNKNOWN_SECRET }}

  ai_hook_equivalence:
    name: AI hook equivalence (Rust/Python)
    # `rust` is a second, native implementation of
    # `ggshield secret scan ai-hook`, reached through the `ggshield` dispatcher
    # with the same argv an agent uses. It reimplements the local ignore rules
    # from .gitguardian.yaml, the five agent output contracts, and the payload
    # parsing -- all security-relevant logic that now exists twice. This job is
    # the only thing keeping the two copies honest: it compares the verdict AND
    # the POSTed /v1/multiscan body against the real Python hook. If it is
    # removed, weakened, or given a `paths` filter, that protection goes away
    # silently.
    #
    # Deliberately NOT path-filtered. The equivalence result depends on far more
    # of the package than it looks: ggshield/verticals/ai/** (parsing, output
    # contracts, message templates), ggshield/core/config/** (discovery, v1
    # conversion, token resolution), ggshield/verticals/secret/**
    # (compute_ignore_reason -- the ignore rules themselves),
    # ggshield/core/filter.py (censoring, ignore shas), core/text_utils.py
    # (message wording), core/url_utils.py, core/dirs.py, core/constants.py,
    # core/errors.py (exit codes), core/scan/**, utils/_binary_extensions.py,
    # cmd/secret/scan/ai_hook.py, and pyproject.toml / uv.lock (a pygitguardian
    # bump can change the wire schema -- that is how the `type` vs `break_type`
    # bug was found). Enumerating that list is a maintenance burden whose
    # failure mode is a silent false negative, so the job just always runs.
    # A few minutes of CI is the cheaper side of that trade.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv sync --locked --group dev --group tests

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo|${{ runner.os }}|${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}

      - name: Check formatting
        working-directory: rust
        # rust-toolchain.toml pins the version, so rustup provisions it here.
        run: cargo fmt --all --check

      - name: Lint
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run unit tests
        working-directory: rust
        run: cargo test --workspace

      - name: Check the vendored binary extension list is in sync
        # src/binary_extensions.rs is generated from the Python set. It decides
        # which files are read from disk and scanned, so drift is a detection
        # gap, not cosmetics.
        run: |
          uv run python - <<'PY'
          import pathlib, re, sys
          from ggshield.utils._binary_extensions import BINARY_EXTENSIONS

          rust = pathlib.Path("rust/common/src/binary_extensions.rs").read_text()
          # cargo fmt packs the array, so match the literals, not whole lines.
          # Nothing before "= [" contains a quote, so the split is unambiguous.
          vendored = set(re.findall(r'"([^"]+)"', rust.split("= [", 1)[1]))
          if vendored != set(BINARY_EXTENSIONS):
              missing = sorted(set(BINARY_EXTENSIONS) - vendored)
              extra = sorted(vendored - set(BINARY_EXTENSIONS))
              sys.exit(
                  "rust/common/src/binary_extensions.rs is out of sync with "
                  f"ggshield/utils/_binary_extensions.py\n  missing: {missing}\n  extra: {extra}"
              )
          print(f"{len(vendored)} extensions in sync")
          PY

      - name: Build the release binary
        working-directory: rust
        run: cargo build --release

      - name: Compare against the Python hook
        # Runs both implementations against the same payloads, the same
        # .gitguardian.yaml fixtures and the same localhost mock API. Nothing
        # reaches the real GitGuardian API: the mock is the only server
        # involved, and no API key is provided to this job.
        env:
          GGSHIELD_VENV_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          python3 rust/tests/equivalence.py

  rust:
    name: Rust (${{ matrix.os }})
    # The equivalence job above only runs cargo on ubuntu, so the platform-
    # specific code -- the three keychain readers and the Windows config dir --
    # is never clippy'd or tested. This job builds and tests the workspace on
    # each OS so that code cannot rot silently.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-rustjob|${{ runner.os }}|${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  build_os_packages:
    uses: ./.github/workflows/build_release_assets.yml
    secrets: inherit

  test_github_secret_scan_action:
    name: Test GitHub action for `secret scan`
    # See note about steps requiring the GITGUARDIAN_API at the top of this file
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan commits for hardcoded secrets
        uses: ./actions-unstable/secret
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
          GITGUARDIAN_API_URL: ${{ secrets.GITGUARDIAN_API_URL }}

  push_docker_images-unstable:
    name: Push Docker image to Docker Hub and GitHub Packages
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs:
      - lint
      - build
      - functest_api
      - test_github_secret_scan_action
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            gitguardian/ggshield:unstable
            ghcr.io/gitguardian/ggshield/ggshield:unstable
