# This workflow only accepts PRs if they either contain a changelog fragment,
# or have been applied the `skip-changelog` label.
name: Changelog check

on:
  pull_request:
    types:
      # On by default if you specify no types.
      - 'opened'
      - 'reopened'
      - 'synchronize'
      # For `skip-changelog` only.
      - 'labeled'
      - 'unlabeled'

# Fires once per label change, and only the last run sees the final label set.
concurrency:
  group: changelog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-changelog:
    runs-on: ubuntu-22.04
    steps:
      - name: 'Check for changelog fragment'
        uses: brettcannon/check-for-changed-files@d85c64d17b3c1d0ac57c9cc46ea39399b0d6fa71 # v1.2.2
        with:
          file-pattern: |
            changelog.d/*.md
            CHANGELOG.md
          skip-label: 'skip-changelog'
          failure-message: 'Missing a changelog fragment in ${file-pattern}. Please add one using `scriv create` or apply the `${skip-label}` label to the pull request'
