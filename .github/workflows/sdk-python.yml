# The Python SDK in packages/python, which ships the same secret-resolution
# engine as the Rust crates. Its own workflow rather than a job in ci.yml: it
# is the only way GitHub Actions can scope a check to the paths that affect it,
# and nothing else in the repository shares its toolchain (uv + ruff + ty).
name: Python SDK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sdk-python.yml'
      # providers/*.yaml is the single source the SDK vendors at build time.
      - 'providers/**'
      - 'packages/python/**'
  pull_request:
    paths:
      - '.github/workflows/sdk-python.yml'
      - 'providers/**'
      - 'packages/python/**'

concurrency:
  group: sdk-python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Same uv as ci.yml pins; bump both together.
  UV_VERSION: 0.10.8

jobs:
  python_sdk:
    name: Test
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}

      # --locked, not --frozen: a pyproject.toml edit that was never locked
      # should fail here rather than resolve to something nobody committed.
      - name: Install dependencies
        run: uv sync --locked

      # The vendoring build hook copies providers/*.yaml into the package, so
      # the tests run against the same definitions the Rust crates parse.
      - name: Test
        run: uv run --frozen pytest

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Type check
        run: uv run --frozen ty check
