name: Build platform wheel
description: Build, optionally code-sign, smoke test and upload the macOS universal2 or Windows amd64 platform wheel

inputs:
  sign:
    description: Code-sign the binary, failing if the signing inputs are empty
    default: 'false'
  macos-p12-file:
    description: Base64-encoded macOS signing certificate
    default: ''
  macos-p12-password:
    description: Password of the macOS signing certificate
    default: ''
  windows-cert-fingerprint:
    description: Fingerprint of the Windows signing certificate
    default: ''
  sm-api-key:
    description: DigiCert KeyLocker API key
    default: ''
  sm-host:
    description: DigiCert KeyLocker host
    default: ''
  sm-client-cert-file:
    description: Base64-encoded DigiCert KeyLocker client certificate
    default: ''
  sm-client-cert-password:
    description: Password of the DigiCert KeyLocker client certificate
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14'
    # Commented `v1`, not a semver tag: this action publishes only `v1` and
    # per-version branches (`stable` is a branch too, and moves every rustup
    # release). Which toolchain actually builds the binary is decided
    # separately -- hatch_build.py runs cargo with cwd=rust/, so
    # rust/rust-toolchain.toml pins that.
    - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
      with:
        # Required once pinned by SHA: the `stable` *branch* used to default
        # this input, so `@stable` supplied the toolchain through the ref
        # itself. Naming it here is what that ref meant.
        toolchain: stable
        targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
    # Only `sign: true` callers get here, and for them signing is not
    # best-effort: an unsigned `ggshield` publishes fine and only shows up
    # months later, as every upgrade re-prompting for Keychain access. Fail
    # instead of shipping one.
    - name: Prepare code signing (macOS)
      if: runner.os == 'macOS' && inputs.sign == 'true'
      shell: bash
      env:
        MACOS_P12_FILE: ${{ inputs.macos-p12-file }}
        MACOS_P12_PASSWORD: ${{ inputs.macos-p12-password }}
        # Same rcodesign as the build-os-packages action installs for the
        # standalone bundles; bump both together. The checksum is the aarch64
        # one -- the macOS wheel is built on macos-14 and lipo'd, so there is
        # no Intel runner here. Not named RCODESIGN_*: rcodesign folds every
        # variable carrying that prefix into its configuration and fails on
        # the keys it does not recognise.
        APPLE_CODESIGN_VERSION: 0.27.0
        APPLE_CODESIGN_SHA256: 163520079cd6ad1427791c792735a6ddfcb8eca0187bbcf0cc0bebfa4a62153d
      run: |
        set -euo pipefail
        if [ -z "$MACOS_P12_FILE" ] ; then
          echo "sign: true, but the signing secrets are not readable here" >&2
          exit 1
        fi

        # scripts/download needs `sha256sum`, which macOS does not ship.
        brew install coreutils
        # Unpacked outside the checkout: `python -m build` runs on it next.
        scripts/download \
          "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F$APPLE_CODESIGN_VERSION/apple-codesign-$APPLE_CODESIGN_VERSION-aarch64-apple-darwin.tar.gz" \
          "$RUNNER_TEMP/rcodesign.tar.gz" \
          "$APPLE_CODESIGN_SHA256"
        tar -C "$RUNNER_TEMP" --strip-components=1 -xzf "$RUNNER_TEMP/rcodesign.tar.gz"
        cp "$RUNNER_TEMP/rcodesign" /usr/local/bin

        SECRETS_DIR=$RUNNER_TEMP/secrets
        mkdir -p "$SECRETS_DIR"
        # The p12 is base64-encoded because it is binary.
        echo "$MACOS_P12_FILE" | base64 --decode > "$SECRETS_DIR/cert.p12"
        echo "$MACOS_P12_PASSWORD" > "$SECRETS_DIR/cert.pwd"
        cat >> "$GITHUB_ENV" <<EOF
        MACOS_P12_FILE=$SECRETS_DIR/cert.p12
        MACOS_P12_PASSWORD_FILE=$SECRETS_DIR/cert.pwd
        EOF

    # Authenticode-signed like the .msi and the .zip. A signature binds no
    # stored credential here the way a macOS Keychain ACL does, but this is the
    # `ggshield` every invocation runs, and an unsigned native executable inside
    # a venv is what AV and EDR heuristics react to. Fail rather than ship one:
    # `pip install` offers nobody a second chance to check.
    - name: Prepare code signing (Windows)
      if: runner.os == 'Windows' && inputs.sign == 'true'
      shell: bash
      env:
        WINDOWS_CERT_FINGERPRINT: ${{ inputs.windows-cert-fingerprint }}
        SM_API_KEY: ${{ inputs.sm-api-key }}
        SM_HOST: ${{ inputs.sm-host }}
        SM_CLIENT_CERT_FILE: ${{ inputs.sm-client-cert-file }}
        SM_CLIENT_CERT_PASSWORD: ${{ inputs.sm-client-cert-password }}
      run: |
        set -euo pipefail
        if [ -z "$SM_API_KEY" ] ; then
          echo "sign: true, but the signing secrets are not readable here" >&2
          exit 1
        fi

        # Newest SDK present rather than a pinned one: the version differs per
        # runner image (windows-2022 carries 10.0.22621.0, windows-2025
        # 10.0.26100.0) and this job runs on whatever `windows-latest` currently
        # is. The build-os-packages action can pin because its callers pin
        # their image too.
        # `|| true`: with pipefail an unmatched glob would abort the step here,
        # before the diagnostic below gets to say what was missing.
        signtool_dir=$(
          ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64 2>/dev/null |
            sort -V | tail -1 || true
        )
        if [ -z "$signtool_dir" ] || [ ! -x "$signtool_dir/signtool.exe" ] ; then
          echo "no signtool.exe under the Windows Kits 10 bin directories" >&2
          ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"* 2>&1 >&2 || true
          exit 1
        fi
        echo "Signing with $signtool_dir/signtool.exe"
        # Windows-form on PATH: smctl is a native process and looks signtool up
        # through %PATH%, where a `/c/...` entry means nothing.
        cygpath -w "$signtool_dir" >> "$GITHUB_PATH"
        # The next step installs smctl, so do not look for it yet.
        cygpath -w "/c/Program Files/DigiCert/DigiCert Keylocker Tools" >> "$GITHUB_PATH"

        # `cygpath -m`: a drive-letter path with forward slashes, which both bash
        # and smctl accept. $RUNNER_TEMP is backslashed here, and bash reads a
        # backslash as an escape rather than a separator, so a path built from it
        # raw names one file to `mkdir` and a different, missing one to `[ -f ]`.
        SECRETS_DIR=$(cygpath -m "$RUNNER_TEMP")/secrets
        mkdir -p "$SECRETS_DIR"
        # The client certificate is base64-encoded because it is binary.
        echo "$SM_CLIENT_CERT_FILE" | base64 --decode > "$SECRETS_DIR/cert.p12"
        cat >> "$GITHUB_ENV" <<EOF
        WINDOWS_CERT_FINGERPRINT=$WINDOWS_CERT_FINGERPRINT
        SM_API_KEY=$SM_API_KEY
        SM_HOST=$SM_HOST
        SM_CLIENT_CERT_FILE=$SECRETS_DIR/cert.p12
        SM_CLIENT_CERT_PASSWORD=$SM_CLIENT_CERT_PASSWORD
        EOF

    - name: Install the signing tools
      if: runner.os == 'Windows' && inputs.sign == 'true'
      shell: bash
      run: scripts/build-os-packages/install-keylockertools

    # hatch_build.py signs the binary itself, right after cargo (and lipo on
    # macOS): nothing outside the build can, because the wheel is zipped
    # around it.
    - name: Build wheel
      shell: bash
      env:
        GGSHIELD_BUILD_RUST: '1'
      run: |
        python -m pip install --upgrade build
        python -m build --wheel --outdir dist
    - name: Smoke test the wheel
      shell: bash
      run: scripts/smoke-test-wheel dist/*.whl
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: wheel-${{ runner.os == 'macOS' && 'macos-universal2' || 'windows-amd64' }}
        path: dist/*.whl
