[package]
# Named `ggshield` because it *is* `ggshield`: this binary is what the bundle
# installs on the PATH, and it delegates to the renamed PyInstaller launcher
# (`ggshield-py`) for every command it does not handle itself.
name = "ggshield"
# Crate metadata only; nothing is published from here. The version the hook
# *reports* to the API comes from ggshield's own `__version__`, read at build
# time by build.rs.
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
resolver = "2"
publish = false
description = "The `ggshield` front door: `secret scan ai-hook` natively, everything else to `ggshield-py`."

[dependencies]
# Hook payload in, GitGuardian /v1/multiscan response out. `preserve_order` is
# load-bearing: an MCP tool's arguments are re-serialized and scanned as text, so
# without it serde_json would sort the agent's own keys and we would scan bytes
# the agent never sent.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# auth_config.yaml (the token file). Maintained fork of the archived serde_yaml.
serde_yaml_ng = "0.10"

ureq = { version = "=3.5.2", default-features = false, features = ["rustls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-platform-verifier = "0.7"
webpki-root-certs = "1"

# `@file` extraction out of user prompts — mirrors _FILE_PATH_REGEX in hooks.py.
regex = "1"

# Vibe's `config.toml`, for the MCP server names that tell a `{server}_{tool}`
# call from one of Vibe's own tools. No `display`: we only ever read.
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

# Payload debounce hash + the content identifier, both sha256 in the Python.
sha2 = "0.10"

# Cache/config dirs. Matches what platformdirs returns for ggshield.
dirs = "7"

# RFC 3339 parsing for the stored token's expiry date.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

thiserror = "2.0.21"
gg_url = "0.2.0"
gg_fs = "0.4.0"
dotenv = { package = "dotenv-ng", version = "1.0.0" }
log = "0.4.35"
clap = { version = "4.6.10", features = ["derive"] }

# O_NOFOLLOW and getuid for the cache files' ownership checks, flock for the
# keyring lock. Already in the tree transitively; std exposes none of them.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Read-only keychain access, in-process: no fork+exec on the hot path, and the
# only API we link is the read one, so a write is not expressible.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

# Read-only Secret Service (libsecret/D-Bus) access, to read the same item
# Python's `keyring` SecretService backend wrote. Pure-Rust zbus, no libdbus C
# link; blocking API, like the HTTP client. Only `search_items` + `get_secret`.
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5", default-features = false, features = ["rt-async-io-crypto-rust"] }

# Read-only Windows Credential Manager access (`CredReadW`), matching the
# WinVaultKeyring target scheme Python's `keyring` writes; we link nothing but
# the read entry point. `LockFileEx` (Storage_FileSystem + System_IO for
# OVERLAPPED) is the byte-range lock `filelock` takes via `msvcrt.locking`, so
# the credential read serialises against `ggshield`'s. Ctrl-C has to be handed
# to the child, which needs SetConsoleCtrlHandler. The machine identity reads
# the hostname and username as Python does (SystemInformation, WindowsProgramming).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security_Credentials",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_SystemInformation",
  "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
tempfile = "3"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }

[lints.clippy]
unwrap_used = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
# NOT panic = "abort": `run_hook()` catches unwinds so a bug still fails open
# with a warning instead of killing the hook. See src/subcommands/secret/scan/ai_hook.rs.
