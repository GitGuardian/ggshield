[package]
name = "ggshield-secrets"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Secret resolution against Vault and device-local encrypted files."

[features]
# Derive clap::ValueEnum on Provider so binaries can take it as a CLI arg.
clap = ["dep:clap"]
# TEST ONLY. Lets $GITGUARDIAN_TEST_KEYSET_FILE stand in for the OS credential
# store, so the CLI integration tests can exercise real encryption without a
# login keychain. Never enable it in a shipped build.
test-keystore = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
percent-encoding = "2"
secrecy = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"
ureq = { workspace = true }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
# Not the workspace sha2: hkdf 0.13 needs 0.11, which secret-service already pulls in.
hkdf = "0.13"
sha2 = "0.11"
getrandom = "0.4"
zeroize = "1"
base64 = "0.23"
tempfile = { workspace = true }
keyring = "4"
etcetera = "0.11"

# O_NOFOLLOW on the dotenv open path: the pathname check and the open are two
# syscalls, so only the open flag can close the window between them.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lints]
workspace = true
