name: 'ggshield secret scan'
description: 'Scan commits for hardcoded secrets.'
author: GitGuardian <support@gitguardian.com>

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  args:
    description: |
      Arguments to pass to `ggshield secret scan ci`.

      [`ggshield secret scan ci` reference](https://docs.gitguardian.com/ggshield-docs/reference/secret/scan/ci).
    required: false
  ca_bundle:
    description: |
      Path to a CA bundle file, relative to the repository root.

      Use this on self-hosted runners whose HTTPS traffic goes through a proxy
      or firewall that presents a corporate/internal CA certificate not included
      in the default system trust store.

      Example:
      ```yaml
      - uses: GitGuardian/ggshield-action@v1
        with:
          ca_bundle: certs/corporate-ca.crt
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
      ```
    required: false

runs:
  using: 'docker'
  image: 'docker://gitguardian/ggshield:v1.54.0'
  entrypoint: '/app/docker/actions-secret-entrypoint.sh'
  args:
    - ${{ inputs.args }}
