name: onepassword
description: 1Password items through a Connect server
base_url: ${OP_CONNECT_HOST}

auth:
  strategy: token
  token_env: OP_CONNECT_TOKEN
  header: Authorization
  scheme: Bearer

endpoints:
  list_vaults:
    method: GET
    path: /v1/vaults
  list_items:
    method: GET
    path: /v1/vaults/${vault_id}/items
  read_secret:
    method: GET
    path: /v1/vaults/${vault_id}/items/${item_id}
    secret: fields
  create_secret:
    method: POST
    path: /v1/vaults/${vault_id}/items
  write_secret:
    method: PUT
    path: /v1/vaults/${vault_id}/items/${item_id}
  delete_secret:
    method: DELETE
    path: /v1/vaults/${vault_id}/items/${item_id}
